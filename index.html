const $=s=>document.querySelector(s),LS=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch(e){return d}},S=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const st=Object.assign({loc:null,dist:null,min:null,siren:true,email:'',push:false},LS('sa2',{}));
const save=()=>S('sa2',st);
/* Valores del sistema: deben ser iguales a sa_radio_km y sa_mag_min en la tabla config de Supabase. dist/min = null significa que la persona usa estos. */
const DEF={dist:300,min:4.5},D=()=>st.dist??DEF.dist,M=()=>st.min??DEF.min;
let ev=LS('sa2ev',[]),map=null,lastOk=0,focus=null,flt=LS('sa2f',0);
const dist=e=>st.loc?Math.round(km(st.loc.lat,st.loc.lon,e.lat,e.lon)):null;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'ahora':m<60?'hace '+m+' min':m<1440?'hace '+Math.round(m/60)+' h':'hace '+Math.round(m/1440)+' d'};
const cl=m=>m>=6?'r':m>=4.5?'a':'';
/* Regla: avisa si supera tu magnitud mínima dentro de tu radio, o si es muy fuerte aunque esté más lejos */
const fuerte=m=>m>=8?1000:m>=7.5?800:m>=7?600:m>=6.5?400:0;
const avisar=(e,d)=>d!=null&&((e.mag>=M()&&d<=D())||d<=fuerte(e.mag));
const same=(a,b)=>Math.abs(a.t-b.t)<9e4&&km(a.lat,a.lon,b.lat,b.lon)<120;
const locKey=()=>st.loc?st.loc.lat.toFixed(2)+','+st.loc.lon.toFixed(2):'';
const fmtN=n=>Number(n).toLocaleString('es');

/* ===== Datos ===== */
async function get(u,txt){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return txt?await r.text():await r.json()}finally{clearTimeout(t)}}
async function load(){
 const since=new Date(Date.now()-2*864e5).toISOString().slice(0,19);
 const res=await Promise.allSettled(SRC.map(s=>get(s.url(since),s.txt).then(s.parse)));
 let out=[];res.forEach((r,i)=>{SRC[i].ok=r.status=='fulfilled';if(SRC[i].ok)out=out.concat(r.value)});
 if(!SRC.some(s=>s.ok)){refresh();return}
 const k=[];out.filter(e=>[e.mag,e.lat,e.lon,e.t].every(Number.isFinite)).forEach(e=>{if(!k.some(x=>same(x,e)))k.push(e)});
 /* Se guardan todos los sismos de M4.5 o más y los más recientes de los pequeños */
 ev=[...k.filter(e=>e.mag>=4.5),...k.filter(e=>e.mag<4.5).sort((a,b)=>b.t-a.t).slice(0,250)].sort((a,b)=>b.t-a.t);S('sa2ev',ev);lastOk=Date.now();check();refresh()}
function check(){if(!st.loc)return;const done=LS('sa2done',[]);
 for(const e of ev){if(Date.now()-e.t>18e5||done.includes(e.id))continue;const d=dist(e);if(avisar(e,d)){done.push(e.id);S('sa2done',done.slice(-200));fire(e,d);break}}}

/* ===== Alerta ===== */
let ac,osc,sirI;
function siren(){if(!st.siren)return;stopSiren();try{ac=ac||new AudioContext();ac.resume&&ac.resume();osc=ac.createOscillator();const g=ac.createGain();g.gain.value=.25;osc.connect(g).connect(ac.destination);osc.type='sawtooth';osc.start();let f=0;sirI=setInterval(()=>{osc.frequency.value=(f++%2)?900:600},450)}catch(e){}}
function stopSiren(){clearInterval(sirI);if(osc){try{osc.stop()}catch(e){}osc=null}}
async function notify(e,d){if(!('Notification'in window)||Notification.permission!='granted')return;const t='SismoAlerta M'+e.mag.toFixed(1),o={body:e.place+' · a '+d+' km',icon:'icon-192.png',tag:String(e.id),requireInteraction:true,vibrate:[500,200,500,200,500]};
 try{const r=await swReg();if(r)return await r.showNotification(t,o);new Notification(t,o)}catch(x){}}
function fire(e,d){$('#ovm').textContent='M'+e.mag.toFixed(1);$('#ovt').textContent=e.place+' · a '+d+' km de ti';const o=$('#ov');o.style.display='flex';o.classList.add('on');
 siren();if(navigator.vibrate)navigator.vibrate([500,200,500,200,500,200,500]);if(document.hidden||e.src=='TEST')notify(e,d)}
function stopAlert(){const o=$('#ov');o.style.display='none';o.classList.remove('on');stopSiren();if(navigator.vibrate)navigator.vibrate(0)}
function testAlert(d,m){if(!st.loc)return alert('Primero indica tu ubicación.');fire({id:'t'+Date.now(),mag:m,place:'Alerta de prueba',t:Date.now(),lat:st.loc.lat,lon:st.loc.lon,src:'TEST'},d)}

/* ===== Ubicación ===== */
function locChanged(){save();syncSub();check();render()}
function gps(){if(!navigator.geolocation)return alert('Este dispositivo no permite obtener la ubicación.');
 navigator.geolocation.getCurrentPosition(async p=>{st.loc={lat:p.coords.latitude,lon:p.coords.longitude,name:'Mi ubicación (GPS)'};
  try{const j=await get('https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat='+st.loc.lat+'&lon='+st.loc.lon);if(j.display_name)st.loc.name=j.display_name.split(',').slice(0,2).join(',')}catch(e){}
  locChanged()},()=>alert('No se pudo obtener tu ubicación. Revisa el permiso o escribe tu ciudad.'),{enableHighAccuracy:false,timeout:15000})}
async function city(){const q=$('#city').value.trim();if(!q)return;
 try{const j=await get('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!j[0])return alert('No encontré ese lugar.');
  st.loc={lat:+j[0].lat,lon:+j[0].lon,name:j[0].display_name.split(',').slice(0,2).join(',')};locChanged()}catch(e){alert('No se pudo buscar. Revisa tu conexión.')}}


/* ===== Lugares guardados (hasta 6) ===== */
const favs=()=>{const a=LS('sa5fav',[]);return Array.isArray(a)?a:[]};
function favHtml(){const a=favs(),cur=st.loc&&a.some(f=>f.lat.toFixed(2)==st.loc.lat.toFixed(2)&&f.lon.toFixed(2)==st.loc.lon.toFixed(2));
 return '<div style="margin-top:12px">'+(a.length?'<p class="sm"><b>Mis lugares guardados</b></p><div class="chips">'+a.map((f,i)=>'<span class="chp" style="display:inline-flex;gap:8px;align-items:center"><span onclick="favGo('+i+')" role="button" tabindex="0">'+esc(f.name)+'</span><span onclick="favDel('+i+')" role="button" aria-label="Quitar" style="opacity:.6">✕</span></span>').join('')+'</div>':'')+
 (st.loc&&!cur&&a.length<6?'<button class="btn w" style="margin-top:8px" onclick="favAdd()">Guardar este lugar en mi lista</button>':'')+'<p class="sm">Al elegir un lugar de la lista también cambia el lugar de tus avisos de sismos.</p></div>'}
function favAdd(){const a=favs();if(!st.loc||a.length>=6)return;a.push({lat:st.loc.lat,lon:st.loc.lon,name:st.loc.name});S('sa5fav',a);render()}
function favGo(i){const f=favs()[i];if(!f)return;st.loc={lat:f.lat,lon:f.lon,name:f.name};locChanged()}
function favDel(i){const a=favs();a.splice(i,1);S('sa5fav',a);render()}
/* ===== Supabase: correo y push (funciones ya existentes) ===== */
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let j=null;try{j=await r.json()}catch(x){}return j||{ok:false,error:'El servidor no responde'}});
const u8=b=>{const s=(b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function swReg(){if(!('serviceWorker'in navigator)||location.protocol.indexOf('http')!=0)return null;try{return await navigator.serviceWorker.ready}catch(e){return null}}
async function mail(){const m=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(m))return alert('Escribe un correo válido.');if(!st.loc)return alert('Primero indica tu ubicación.');
 const j=await post(MAILFN,{accion:'suscribir',email:m,lat:st.loc.lat,lon:st.loc.lon,lugar:st.loc.name});if(!j.ok)return alert('No se pudo activar: '+(j.error||'error'));st.email=m;save();render()}
async function pushOn(){
 if(!('PushManager'in window))return alert('Este navegador no admite push. En iPhone: Compartir → Añadir a pantalla de inicio y abre la app desde ese ícono.');
 if(!st.loc)return alert('Primero indica tu ubicación.');
 const r=await swReg();if(!r)return alert('Abre la app desde una dirección https, no desde un archivo local.');
 if(await Notification.requestPermission()!='granted')return alert('Debes permitir las notificaciones.');
 try{let s=await r.pushManager.getSubscription();if(!s)s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(PUSH.vapid)});
  const j=await post(PUSH.fn,{accion:'suscribir',sub:s.toJSON(),lat:st.loc.lat,lon:st.loc.lon,email:st.email||'',lugar:st.loc.name,dist:st.dist,min:st.min});
  if(!j.ok)throw new Error(j.error||'error');st.push=true;save()}catch(e){st.push=false;save();alert('No se pudo activar: '+e.message)}render()}
async function pushOff(){try{const r=await swReg(),s=r&&await r.pushManager.getSubscription();if(s){try{await post(PUSH.fn,{accion:'baja',endpoint:s.endpoint})}catch(e){}await s.unsubscribe()}}catch(e){}st.push=false;save();render()}
async function syncSub(){if(!st.loc)return;if(st.email)try{await post(MAILFN,{accion:'suscribir',email:st.email,lat:st.loc.lat,lon:st.loc.lon,lugar:st.loc.name})}catch(e){}
 if(st.push)try{const r=await swReg(),s=r&&await r.pushManager.getSubscription();if(s)await post(PUSH.fn,{accion:'suscribir',sub:s.toJSON(),lat:st.loc.lat,lon:st.loc.lon,email:st.email||'',lugar:st.loc.name,dist:st.dist,min:st.min})}catch(e){}}

/* ===== App de Clima (Open-Meteo, gratis y sin clave) ===== */
const CH='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const IC={
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
 cloud:'<path d="M7 18h9.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.4 11.2 3.4 3.4 0 0 0 7 18z"/>',
 pc:'<circle cx="8" cy="8" r="2.6"/><path d="M8 2.5v1.2M2.5 8h1.2M4.1 4.1l.9.9M11.9 4.1 11 5"/><path d="M8 19h9a3.6 3.6 0 0 0 .4-7.2A5 5 0 0 0 8.2 12.4 3.3 3.3 0 0 0 8 19z"/>',
 rain:'<path d="M7 15h9.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.4 8.2 3.4 3.4 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
 snow:'<path d="M7 15h9.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.4 8.2 3.4 3.4 0 0 0 7 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 21.5h.01M14 21.5h.01"/>',
 storm:'<path d="M7 15h9.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.4 8.2 3.4 3.4 0 0 0 7 15z"/><path d="m12.5 15-2 3.5h3L11.5 22"/>',
 fog:'<path d="M4 9h16M6 13h12M4 17h16"/>'};
const ico=(n,c)=>`<svg class="${c||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||IC.cloud}</svg>`;
const wxInfo=c=>c==0?['Despejado','sun']:c==1?['Mayormente despejado','sun']:c==2?['Parcialmente nublado','pc']:c==3?['Nublado','cloud']:c<=48?['Niebla','fog']:c<=55?['Llovizna','rain']:c<=57?['Llovizna helada','rain']:c<=65?['Lluvia','rain']:c<=67?['Lluvia helada','rain']:c<=77?['Nieve','snow']:c<=82?['Chubascos','rain']:c<=86?['Chubascos de nieve','snow']:['Tormenta','storm'];
const hhmm=t=>t?String(t).slice(11,16):'—';
const inRoute=r=>(location.hash||'#/')==r;
const locForm='<button class="btn p w" onclick="gps()">Usar mi ubicación</button><div class="row"><input type="text" id="city" placeholder="Ciudad o lugar" style="flex:1"><button class="btn" onclick="city()">Buscar</button></div>';
const locCard=first=>first?`<div class="card"><h2>¿Dónde estás?</h2><p class="sm">Indica tu ubicación para ver el clima de tu zona.</p>${locForm}${favHtml()}</div>`:`<details class="card cl"><summary>Lugar: ${esc(st.loc.name)} · <u>Cambiar</u></summary>${locForm}${favHtml()}</details>`;

/* --- pronóstico del lugar --- */
let wx=null,wxk='';
{const c0=LS('sa3wx',null);if(c0&&c0.d&&c0.k==locKey()){wx=c0.d;wxk=c0.k}}
const wxFresh=()=>!!(st.loc&&wx&&wxk==locKey());
async function wxLoad(force){
 if(!st.loc)return null;const k=locKey(),c=LS('sa3wx',null);
 if(!force&&c&&c.k==k&&c.d&&Date.now()-c.t<18e5){wx=c.d;wxk=k;return wx}
 const d=await get('https://api.open-meteo.com/v1/forecast?latitude='+st.loc.lat.toFixed(3)+'&longitude='+st.loc.lon.toFixed(3)+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7');
 if(!d||!d.current||!d.daily||!d.hourly)throw 0;wx=d;wxk=k;S('sa3wx',{k,t:Date.now(),d});return d}
/* las próximas 24 horas, desde la hora actual */
const hrs24=()=>{const h=wx.hourly,now=String(wx.current.time).slice(0,13)+':00',i0=Math.max(0,h.time.findIndex(t=>t>=now));
 return Array.from({length:24},(_,k)=>({t:h.time[i0+k],temp:h.temperature_2m[i0+k],pp:h.precipitation_probability[i0+k],code:h.weather_code[i0+k]})).filter(q=>q.t&&q.temp!=null)};

/* --- encabezado de Clima --- */
function wxHero(){
 const h=$('#hero');let body;
 if(!st.loc)body='<h1>Dinos dónde estás</h1><p>Para ver el clima necesitamos tu ubicación.</p>';
 else if(!wxFresh())body='<h1>Cargando clima…</h1><p>'+esc(st.loc.name)+'</p>';
 else{const c=wx.current,i=wxInfo(c.weather_code),d=wx.daily;
  body=`<div class="t0">${Math.round(c.temperature_2m)}°</div><p><b>${i[0]}</b> · sensación ${Math.round(c.apparent_temperature)}° · mín ${Math.round(d.temperature_2m_min[0])}° · máx ${Math.round(d.temperature_2m_max[0])}°</p>`}
 h.innerHTML=`<div class="top"><span class="mark">Clima</span><a class="sw" href="#/">Ver sismos${CH}</a></div>${st.loc?`<button class="loc" style="border:0;cursor:pointer" onclick="chLoc()" aria-label="Cambiar lugar">${esc(st.loc.name)} · cambiar</button>`:''}${body}<canvas id="sg"></canvas>`;tcurve()}
/* La ubicación ya queda guardada: el formulario solo se abre si la persona toca el lugar */
function chLoc(){const f=$('#lf');if(f){f.remove();return}$('#v').insertAdjacentHTML('afterbegin','<div class="card" id="lf"><h2>Cambiar lugar</h2>'+locForm+favHtml()+'</div>');const c=$('#city');if(c)c.focus()}
/* curva de temperatura de las próximas 24 horas */
function tcurve(){const c=$('#sg');if(!c)return;cancelAnimationFrame(sgRaf);const w=c.width=c.clientWidth*2,h=c.height=152,x=c.getContext('2d');
 if(!wxFresh())return;const hs=hrs24();if(hs.length<2)return;
 const t=hs.map(q=>q.temp),lo=Math.min(...t),hi=Math.max(...t),sp=(hi-lo)||1,px=i=>10+(w-20)*i/(hs.length-1),py=v=>h-42-(h-76)*(v-lo)/sp;
 x.lineWidth=3;x.lineJoin='round';x.lineCap='round';x.strokeStyle='#9AD3EA';x.beginPath();hs.forEach((q,i)=>x[i?'lineTo':'moveTo'](px(i),py(q.temp)));x.stroke();
 x.fillStyle='#fff';x.beginPath();x.arc(px(0),py(t[0]),6,0,7);x.fill();
 x.font='600 22px system-ui,sans-serif';x.fillStyle='#B7C5CC';x.textAlign='left';x.fillText('ahora',10,h-4);x.textAlign='right';x.fillText('+24 h',w-10,h-4);
 const im=t.indexOf(hi),il=t.indexOf(lo);x.textAlign='center';x.fillStyle='#F2B24D';x.fillText(Math.round(hi)+'°',px(im),py(hi)-12);if(il!=im){x.fillStyle='#9AD3EA';x.fillText(Math.round(lo)+'°',px(il),py(lo)+26)}}

/* --- Hoy --- */
const wdir=d=>['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'][Math.round(d/45)%8];
const uvTxt=v=>{v=Math.round(v||0);return 'Radiación UV máxima de hoy: '+v+' ('+(v<=2?'baja':v<=5?'moderada: usa gorra':v<=7?'alta: usa protector solar':v<=10?'muy alta: evita el sol del mediodía':'extrema: evita salir al sol')+').'};
function rainBanner(hs){const n=hs.slice(0,12),f=n.find(q=>(q.pp||0)>=50),mx=Math.max(0,...n.map(q=>q.pp||0));
 return `<div class="card"><h2>${f?'Puede llover pronto':'Sin lluvia prevista'}</h2><p class="sm">${f?'Es probable que llueva a eso de las '+f.t.slice(11,13)+' h ('+f.pp+'% de probabilidad). Lleva paraguas.':'En las próximas 12 horas la probabilidad máxima de lluvia es '+mx+'%.'}</p></div>`+'<div id="aqc"></div>'}
async function aqLoad(){const e=$('#aqc');if(!e||!st.loc)return;
 try{const d=await get('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+st.loc.lat.toFixed(3)+'&longitude='+st.loc.lon.toFixed(3)+'&current=us_aqi,pm2_5&timezone=auto'),a=d&&d.current&&d.current.us_aqi;
  if(a==null||!$('#aqc'))return;const q=a<=50?['Buena','el aire está limpio']:a<=100?['Aceptable','personas muy sensibles deben cuidarse']:a<=150?['Regular','evita el ejercicio fuerte afuera']:a<=200?['Mala','reduce el tiempo al aire libre']:['Muy mala','quédate en lugares cerrados'];
  $('#aqc').innerHTML=`<div class="card"><h2>Calidad del aire: ${q[0]}</h2><p class="sm">Índice ${Math.round(a)}${d.current.pm2_5!=null?' · partículas PM2.5 '+Math.round(d.current.pm2_5)+' µg/m³':''}. ${q[1][0].toUpperCase()+q[1].slice(1)}.</p></div>`}catch(e){}}
async function wxv(v){
 if(!st.loc){v.innerHTML=locCard(true);return}
 if(!wxFresh())v.innerHTML='<div class="card"><h2>Clima</h2><p class="sm">Cargando pronóstico…</p></div>';
 let note='';
 try{await wxLoad()}catch(e){
  if(!wxFresh()){if(inRoute('#/clima'))v.innerHTML='<div class="card"><h2>No se pudo cargar el clima</h2><p class="sm">Revisa tu conexión e inténtalo de nuevo.</p><button class="btn p w" onclick="wxLoad(true).then(render).catch(render)">Reintentar</button></div>'+locCard();return}
  note='Sin conexión: se muestran los últimos datos guardados.'}
 if(!inRoute('#/clima')||!wxFresh())return;
 wxHero();
 const c=wx.current,u=wx.daily,hs=hrs24(),lo=Math.min(...u.temperature_2m_min),hi=Math.max(...u.temperature_2m_max),sp=(hi-lo)||1;
 v.innerHTML=(note?`<p class="sm">${note}</p>`:'')+rainBanner(hs)+

 try{while(off<20000){const r=await fetch(SB.url+'/rest/v1/sismos?select=id,fuente,mag,lugar,t,lat,lon&order=t.desc&limit=1000&offset='+off,{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key}});
   if(!r.ok)throw 0;const j=await r.json();j.forEach(x=>out.push({id:'sb'+x.id,mag:+x.mag,place:x.lugar||'Sin nombre',t:Date.parse(x.t),lat:x.lat,lon:x.lon,src:x.fuente||'Servidor'}));
   if(j.length<1000)break;off+=1000;if(location.hash=='#/historial'){HX.rows=out.slice();hxPaint()}}
  HX.rows=out;HX.done=true}catch(e){HX.err=true;HX.rows=out}
 HX.busy=false;if(location.hash=='#/historial')hxPaint()}
function hxAll(){const all=[],seen=new Set();[...ev,...mes.d,...HX.rows].filter(e=>[e.mag,e.lat,e.lon,e.t].every(Number.isFinite)).sort((a,b)=>b.t-a.t).forEach(e=>{
  if(seen.has(e.id)||isDel('h',e))return;const key=Math.round(e.t/9e4);for(const k of[key-1,key,key+1]){const a=seen['k'+k];if(a&&a.some(x=>km(x.lat,x.lon,e.lat,e.lon)<120&&Math.abs(x.t-e.t)<9e4))return}
  seen.add(e.id);(seen['k'+key]=seen['k'+key]||[]).push(e);all.push(e)});return all}
function hxSet(k,x){HX[k]=x;if(k!='n')HX.n=100;hxPaint()}
function hxMore(){HX.n=1e9;hxPaint(1)}
function hxPaint(keep){const v=$('#v');if(location.hash!='#/historial'||!v)return;const y=scrollY,t=HX.q.trim().toLowerCase(),all=hxAll(),l=all.filter(e=>e.mag>=HX.m&&(!t||(e.place||'').toLowerCase().includes(t)));lastCsv=l.slice(0,20000);window.hist=l.slice(0,HX.n);SEL.list=l.slice(0,HX.n);
 let dia='',h='';l.slice(0,HX.n).forEach(e=>{const d=new Date(e.t).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),D2=d.charAt(0).toUpperCase()+d.slice(1);if(D2!=dia){dia=D2;h+=`<h3 class="dh">${esc(D2)}</h3>`}h+=row(e)});
 const old=all.length?new Date(all[all.length-1].t).toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'}):'';
 v.innerHTML=`<div class="card"><div class="hd"><p class="lbl">Historial</p><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="mini" onclick="dlCsv()" aria-label="Descargar el historial de sismos">Descargar historial</button></span></div><h2 style="margin-top:6px">Todos los sismos detectados</h2><p class="sm">${fmtN(all.length)} sismos en total${old?', desde el '+old:''}. ${HX.busy?'Cargando más…':HX.err?'No se pudo leer todo el historial del servidor; se muestran los que ya están en tu teléfono.':''}</p>
 <input type="text" class="srch" placeholder="Buscar lugar o país" aria-label="Buscar lugar o país" value="${esc(HX.q)}" oninput="HX.q=this.value;HX.n=100;hxPaintKeep()">
 <div class="chips" role="group" aria-label="Magnitud">${[['Todos',0],['M4.5+',4.5],['M5+',5],['M6+',6],['M7+',7]].map(a=>`<button class="chp${HX.m==a[1]?' on':''}" aria-pressed="${HX.m==a[1]}" onclick="hxSet('m',${a[1]})">${a[0]}</button>`).join('')}</div>
 <a class="lnk" href="#/inbox">← Volver a la Bandeja</a></div>
 <div class="card"><h2>${fmtN(l.length)} resultado${l.length==1?'':'s'}</h2>${delBtns('h')}<div class="list">${h||'<p class="sm">No hay sismos con estos filtros.</p>'}</div>${l.length>HX.n?`<button class="btn p w" onclick="hxMore()">Mostrar más · ver los ${fmtN(l.length)} sismos</button>`:''}${SEL.on&&SEL.ctx=='h'?selBar():''}</div>`;
 if(keep)scrollTo(0,y)}
function hxPaintKeep(){const i=$('.srch'),p=i?i.selectionStart:0;hxPaint(1);const n=$('.srch');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}
function historial(v){hxLoad();hxPaint()}

function mapv(v){if(typeof L=='undefined'){v.innerHTML='<div class="card"><h2>El mapa necesita internet</h2><p class="sm">No se pudo cargar el mapa. Conéctate a internet y vuelve a intentarlo.</p><button class="btn p w" onclick="location.reload()">Reintentar</button></div>';return}v.innerHTML='<div id="map"></div>';map=L.map('map',{zoomControl:true}).setView(st.loc?[st.loc.lat,st.loc.lon]:[10,-20],st.loc?6:2);
 baseMap().addTo(map);
 if(st.loc){L.circle([st.loc.lat,st.loc.lon],{radius:D()*1000,color:'#4F46E5',weight:1,fillOpacity:.06}).addTo(map);L.marker([st.loc.lat,st.loc.lon]).addTo(map).bindPopup('Tú')}
 const mk={};ev.slice(0,300).forEach(e=>{mk[e.id]=L.circleMarker([e.lat,e.lon],{radius:3+e.mag*1.6,color:e.mag>=6?'#E4472B':e.mag>=4.5?'#E9A23B':'#1E7C8C',fillOpacity:.6,weight:1}).addTo(map).bindPopup(`<b>M${e.mag.toFixed(1)}</b> ${esc(e.place)}<br>${ago(e.t)}${st.loc?' · a '+dist(e)+' km':''} · ${e.src}`)});
 const f=focus&&ev.find(e=>e.id==focus);focus=null;if(f&&mk[f.id]){map.setView([f.lat,f.lon],6);mk[f.id].openPopup()}}
function setv(v){v.innerHTML=`
${st.loc?`<details class="card cl"><summary>Lugar: ${esc(st.loc.name)} · <u>Cambiar</u></summary>${locForm}${favHtml()}</details>`:`<div class="card"><h2>Ubicación</h2><p class="sm">Sin definir</p>${locForm}${favHtml()}</div>`}
<div class="card"><h2>Cuándo avisar</h2>
<div class="row"><span>Radio</span><b id="dv">${D()} km</b></div><input type="range" min="50" max="1000" step="50" value="${D()}" aria-label="Radio en km" oninput="st.dist=+this.value;$('#dv').textContent=st.dist+' km';save()" onchange="syncSub();hero()">
<div class="row"><span>Magnitud mínima</span><b id="mv">M${M().toFixed(1)}</b></div><input type="range" min="3" max="7" step="0.5" value="${M()}" aria-label="Magnitud mínima" oninput="st.min=+this.value;$('#mv').textContent='M'+st.min.toFixed(1);save()" onchange="syncSub()">
<p class="sm">Los sismos fuertes avisan desde más lejos: M6.5 hasta 400 km, M7 hasta 600, M7.5 hasta 800 y M8 hasta 1000.</p>
<p class="sm">${st.dist==null&&st.min==null?'Usas los valores del sistema.':'Usas tus propios valores.'}</p><button class="btn w" onclick="st.dist=null;st.min=null;save();syncSub();render()">Usar valores del sistema</button>
<label class="row"><span>Sirena y vibración</span><input type="checkbox" ${st.siren?'checked':''} onchange="st.siren=this.checked;save()"></label></div>
<div class="card"><h2>Avisos con la app cerrada</h2><p class="sm">Recibes la alerta en el teléfono aunque no tengas la app abierta.</p>
<button class="btn ${st.push?'':'p'} w" onclick="${st.push?'pushOff()':'pushOn()'}">${st.push?'Desactivar avisos en segundo plano':'Activar avisos en segundo plano'}</button>
<div class="row" style="margin-top:8px"><input type="email" id="em" placeholder="Correo para avisos" value="${esc(st.email)}" style="flex:1"><button class="btn" onclick="mail()">${st.email?'Actualizar':'Activar'}</button></div></div>
<div class="card"><h2>Probar Slack, Gmail y SMS</h2><p class="sm">Manda un mensaje de prueba por cada canal (máximo 3 pruebas por hora).</p>
<button class="btn p w" id="ckb" style="margin-top:8px" onclick="probarCanales()">Probar los tres canales</button><div id="ckr" class="sm" style="margin-top:8px" role="status"></div></div>
<div class="card"><h2>Probar alerta</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${[[200,4.5],[100,5],[50,5.5],[400,6.5],[1000,8]].map(a=>`<button class="btn" onclick="testAlert(${a[0]},${a[1]})">${a[0]} km · M${a[1]}</button>`).join('')}</div></div>
<div class="card"><h2>Fuentes</h2>${SRC.map(s=>`<div class="row"><span><span class="dot ${s.ok?'ok':s.ok===false?'no':''}"></span>${s.id}</span><span class="sm">${s.ok?'Activa':s.ok===false?'Sin respuesta':'Cargando'}</span></div>`).join('')}
${PENDIENTES.map(p=>`<div class="row"><span style="white-space:nowrap"><span class="dot"></span>${p[0]}</span><span class="sm" style="text-align:right">${p[1]}</span></div>`).join('')}</div>
${DONATE_BANKS.length?`<div class="card"><h2>Apoyar el proyecto</h2>${DONATE_BANKS.map(b=>`<div class="row"><span>${esc(b.banco)}<br><span class="sm">${esc(b.tipo||'')} · ${esc(b.titular||'')}</span></span><b>${esc(b.numero)}</b></div>`).join('')}</div>`:''}
${DONATE_URL?`<a class="btn p w" style="display:block;text-align:center;text-decoration:none" href="${esc(DONATE_URL)}" target="_blank" rel="noopener">Apoyar el proyecto</a>`:''}
<p class="sm" style="margin-top:14px">SismoAlerta informa con datos de redes sísmicas públicas. No sustituye a los sistemas oficiales de protección civil.</p>`}
/* Dos apps en una: Sismos (#/…) y Clima (#/clima…). Cada una tiene su color, su encabezado y su barra de pestañas. */
const inClima=()=>(location.hash||'#/').indexOf('#/clima')==0;
const TI={tray:'<path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5a3.5 3.5 0 0 0 7 0H20"/>',home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>',bars:'<path d="M5 20v-9M12 20V5M19 20v-6"/>',set:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>'};
const TABS={s:[['#/','Inicio','home'],['#/inbox','Bandeja','tray'],['#/map','Mapa','map'],['#/stats','Estadísticas','bars'],['#/settings','Ajustes','set']],c:[['#/clima','Hoy','sun'],['#/clima/map','Mapa','map'],['#/clima/stats','Estadísticas','bars']]};

/* Cada app tiene su propio icono, nombre y color. Al entrar o cambiar de app se muestra su icono un instante. */
const BR={sismos:{n:'SismoAlerta',s:'Alertas de sismos',i:'icon-192.png',a:'apple-sismos.png',m:'manifest.json',c:'#F8FAFC'},clima:{n:'Clima',s:'Pronóstico, mapa y estadísticas',i:'icon-clima-192.png',a:'apple-clima.png',m:'manifest-clima.json',c:'#2563EB'}};
let lastApp=null,spT=0;
function brand(app,splash){const b=BR[app];
 $('#fav').href=b.i;$('#atp').href=b.a;$('#mf').href=b.m;document.title=b.n;
 const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=b.c;
 document.querySelectorAll('.mark').forEach(m=>{if(!m.querySelector('img'))m.insertAdjacentHTML('afterbegin','<img alt="" src="'+b.i+'">')});
 if(splash){const sp=$('#sp');$('#spi').src=b.i;$('#spn').textContent=b.n;$('#sps').textContent=b.s;sp.classList.remove('off');
  const im=$('#spi');im.style.animation='none';void im.offsetWidth;im.style.animation='';
  clearTimeout(spT);spT=setTimeout(()=>sp.classList.add('off'),splash)}}
new MutationObserver(()=>{const a=document.body.dataset.app||'sismos';document.querySelectorAll('.mark').forEach(m=>{if(!m.querySelector('img'))m.insertAdjacentHTML('afterbegin','<img alt="" src="'+BR[a].i+'">')})}).observe($('#hero'),{childList:true});
function render(){if(SEL.on&&!['#/inbox','#/historial'].includes(location.hash)){SEL.on=false;SEL.ids=new Set()}
 let h=location.hash||'#/';if(h=='#/weather'){location.replace('#/clima');return}
 const c=inClima(),v=$('#v'),tabs=TABS[c?'c':'s'];if(map){map.remove();map=null}
 if(!tabs.some(t=>t[0]==h)&&h!='#/historial')h=tabs[0][0];
 const app=c?'clima':'sismos';document.body.dataset.app=app;v.dataset.r=h;
 $('#tabs').innerHTML=tabs.map(t=>`<a href="${t[0]}"${t[0]==h?' class="on" aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TI[t[2]]}</svg><span>${t[1]}</span></a>`).join('');
 if(c){wxHero();h=='#/clima/map'?wmapv(v):h=='#/clima/stats'?wstatv(v):wxv(v);if(h!='#/clima'&&st.loc&&!wxFresh())wxLoad().then(()=>{if(inClima())wxHero()}).catch(()=>{})}
 else{hero();h=='#/map'?mapv(v):h=='#/inbox'?bandeja(v):h=='#/historial'?historial(v):h=='#/settings'?setv(v):h=='#/stats'?statv(v):home(v)}
 brand(app,lastApp===app?0:lastApp===null?1300:900);lastApp=app}
/* Cada minuto llegan sismos nuevos: se actualiza solo lo que corresponde, sin borrar lo que la persona está escribiendo ni mover el mapa. Las alertas siguen funcionando aunque estés en Clima. */
function refresh(){if(inClima())return;const h=location.hash||'#/',a=document.activeElement,typing=a&&['INPUT','SELECT'].includes(a.tagName);hero();if(h=='#/'){if(!typing)home($('#v'))}else if(h=='#/settings'&&!typing)setv($('#v'))}
